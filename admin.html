<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutor SmartMatch · 平台后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1d1b19;--sub:#716c65;--line:#e5dfd7;--accent:#b85d2c;--ok:#2e7d4f;--warn:#a36b18;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:20px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:20px}header p{margin:5px 0 0;color:var(--sub);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.login{max-width:420px;margin:60px auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:12px}.stat b{display:block;font-size:22px}.stat span{color:var(--sub);font-size:12px}
.case{border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0}.case-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{padding:4px 9px;border-radius:999px;background:#f1ece5;font-size:12px}.badge.ok{background:#e8f4ed;color:var(--ok)}.badge.warn{background:#fff3d9;color:var(--warn)}
.meta{font-size:13px;color:var(--sub);line-height:1.55;margin-top:4px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:#9a3c2c}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit}.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-box{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:20px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-item{border:1px solid var(--line);border-radius:10px;padding:10px}.detail-item b{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}.hidden{display:none}.note{background:#fff8e8;border:1px solid #ead8aa;padding:10px;border-radius:10px;font-size:12px;color:#765b1d;margin-top:10px}
@media(max-width:760px){.grid,.formgrid,.detail-grid{grid-template-columns:1fr 1fr}.case-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><h1>Tutor SmartMatch · 平台撮合后台</h1><p>内部使用 · 家长/老师不会看到本页面的等级、成交和佣金数据</p></header>
<main>
<section id="login" class="card login">
  <h2>平台管理员登录</h2>
  <p class="meta">使用 Supabase Auth 管理员账号登录。</p>
  <label>Email</label><input id="email" type="email" placeholder="admin@example.com">
  <label style="display:block;margin:10px 0 5px;">Password</label><input id="password" type="password" placeholder="••••••••">
  <button class="primary" style="width:100%;margin-top:12px" onclick="login()">登录</button>
  <div id="login-msg" class="meta"></div>
</section>

<section id="dashboard" class="hidden">
  <div class="actions" style="justify-content:space-between">
    <div><b id="who"></b></div><button onclick="logout()">退出</button>
  </div>
  <div class="grid" id="stats"></div><div class="card" style="margin-top:14px" id="followup-center">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <div><h2 style="margin:0">🔔 待跟进中心</h2><div class="meta">根据时间线里的“下一步时间”自动整理，完成后可直接标记。</div></div>
    <button onclick="loadFollowups()">刷新</button>
  </div>
  <div class="grid" id="followup-stats" style="margin-top:12px"></div>
  <div id="followup-list" style="margin-top:10px"></div>
</div>
  <div class="card" style="margin-top:14px" id="daily-war-room">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <div><h2 style="margin:0">🎯 今日运营作战台</h2><div class="meta">按新加坡时间排序：先处理逾期，再处理今天任务，再处理高风险案例。</div></div>
      <button onclick="loadWarRoom()">刷新作战台</button>
    </div>
    <div class="grid" id="warroom-stats" style="margin-top:12px"></div>
    <div class="actions" style="margin-top:10px;flex-wrap:wrap">
      <button onclick="warFilter='all';renderWarRoom()">全部</button>
      <button onclick="warFilter='overdue';renderWarRoom()">🔴 逾期</button>
      <button onclick="warFilter='today';renderWarRoom()">🟠 今天</button>
      <button onclick="warFilter='risk';renderWarRoom()">⚠️ 高风险</button>
      <button onclick="warFilter='7days';renderWarRoom()">📅 未来7天</button>
    </div>
    <div id="warroom-list" style="margin-top:10px"></div>
  </div>
  <div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><h2 style="margin:0">待处理撮合</h2><div class="meta">优先处理 SmartMatch 已建立的撮合案例</div></div><div class="actions" style="margin-top:0"><button onclick="filterCases('all')">全部</button><button onclick="filterCases('matched')">已配对</button><button onclick="filterCases('contacting')">沟通中</button><button onclick="filterCases('trial')">试听中</button><button onclick="filterCases('pending_confirmation')">待确认</button></div></div></div>
  <div class="note">佣金规则：确认成交时自动计算 = 实际每小时课费 × 单次课时 × 2。内部等级只用于平台运营，不会显示给家长或老师。</div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h2 style="margin:0">撮合案例</h2><button onclick="loadCases()">刷新</button>
    </div>
    <div id="cases"></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h2 style="margin:0">家长需求管理</h2><button onclick="loadDirectory()">刷新</button>
    </div>
    <div id="parent-directory"></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h2 style="margin:0">老师资料管理</h2><button onclick="loadDirectory()">刷新</button>
    </div>
    <div id="tutor-directory"></div>
  </div>
</section>
</main>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 id="modal-title" style="margin:0"></h2><button onclick="closeModal()">关闭</button>
    </div>
    <div id="modal-body" style="margin-top:14px"></div>
  </div>
</div>
<script>
const sb=supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.anonKey);
let cases=[];let caseFilter='all';let directoryCache={parents:[],tutors:[]};let followups=[];let warFilter='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalizeWhatsApp(value){
  let d=String(value||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.length===8)d='65'+d;
  return d;
}
async function openWhatsApp(target,number,caseId){
  const d=normalizeWhatsApp(number);
  if(!d){alert('没有可用的 WhatsApp 号码');return;}
  const text=encodeURIComponent(target==='parent'?'您好，这里是 SG Tutor Match，想跟进您的家教需求。':'您好，这里是 SG Tutor Match，想跟进您的家教资料与 SmartMatch。');
  window.open('https://wa.me/'+d+'?text='+text,'_blank','noopener');
  try{
    const {data:{user}}=await sb.auth.getUser();
    if(user&&caseId){
      await sb.from('match_case_notes').insert({match_case_id:caseId,admin_user_id:user.id,note_type:'whatsapp',contact_target:target,note:'通过后台 WhatsApp 联系',next_action:null});
      await sb.from('match_cases').update({last_contacted_at:new Date().toISOString()}).eq('id',caseId);
      await loadFollowups(); await loadCases();
    }
  }catch(e){console.warn('WhatsApp log failed',e);}
}
function msg(s){document.getElementById('login-msg').textContent=s}
async function login(){
  const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
  if(!email||!password){msg('请输入账号和密码');return}
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){msg('登录失败：'+error.message);return}
  await boot();
}
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){document.getElementById('login').classList.remove('hidden');return}
  const {data:admin,error}=await sb.from('platform_admins').select('display_name,active').eq('user_id',user.id).maybeSingle();
  if(error||!admin||!admin.active){
    msg('此账号还没有平台管理员权限。请在 Supabase SQL Editor 将该 Auth User ID 加入 platform_admins： '+user.id);
    await sb.auth.signOut();return;
  }
  document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('who').textContent='管理员：'+(admin.display_name||user.email);
  await loadCases();
  await loadDirectory();
  await loadFollowups();loadWarRoom();
}
async function loadCases(){
  const {data,error}=await sb.from('match_cases').select('*,parent_requests(id,level,subject,region,budget,freq,duration,timeslot,goal,contact_name,contact_phone,contact_email,contact_wechat),tutor_profiles(id,name,rate,cred,whatsapp,contact_email,contact_phone,tutor_status)').order('created_at',{ascending:false});
  if(error){document.getElementById('cases').innerHTML='<div class="meta">读取失败：'+esc(error.message)+'</div>';return}
  cases=data||[];renderStats();renderCases();
}
function localDateKey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function startOfLocalDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function followupBucket(v){
  const now=new Date(),day=startOfLocalDay(now),target=new Date(v),td=startOfLocalDay(target);
  const diff=Math.round((td-day)/86400000);
  if(diff<0)return 'overdue';if(diff===0)return 'today';if(diff===1)return 'tomorrow';return 'later'
}
async function loadFollowups(){
  const el=document.getElementById('followup-list');if(!el)return;
  el.innerHTML='<div class="meta">正在读取待跟进事项...</div>';
  const {data,error}=await sb.from('match_case_notes').select('id,match_case_id,contact_target,note_type,note,next_action,next_action_at,created_at,completed_at,match_cases(id,status,parent_requests(contact_name,subject,level),tutor_profiles(name))').not('next_action_at','is',null).is('completed_at',null).order('next_action_at',{ascending:true});
  if(error){el.innerHTML='<div class="meta">读取失败：'+esc(error.message)+'</div>';return}
  followups=data||[];
  const counts={overdue:0,today:0,tomorrow:0};followups.forEach(x=>{const b=followupBucket(x.next_action_at);if(counts[b]!==undefined)counts[b]++});
  document.getElementById('followup-stats').innerHTML=
    '<div class="stat" style="cursor:pointer" onclick="showFollowups(\'overdue\')"><b>⚪ '+counts.overdue+'</b><span>已逾期未跟进</span></div>'+
    '<div class="stat" style="cursor:pointer" onclick="showFollowups(\'today\')"><b>🔴 '+counts.today+'</b><span>今天要跟进</span></div>'+
    '<div class="stat" style="cursor:pointer" onclick="showFollowups(\'tomorrow\')"><b>🟠 '+counts.tomorrow+'</b><span>明天要跟进</span></div>';
  renderFollowups(followups);
}
function followStatusText(s){return {new:'新需求',matched:'已配对',contacting:'平台沟通中',trial:'已安排试听',pending_confirmation:'待确认',confirmed:'已确认成交',ongoing:'进行中',not_concluded:'未成交',cancelled:'已取消'}[s]||s}
function renderFollowups(rows){
  const el=document.getElementById('followup-list');
  if(!rows.length){el.innerHTML='<div class="meta">🎉 暂时没有待跟进事项。</div>';return}
  const groups={overdue:'⚪ 已逾期',today:'🔴 今天',tomorrow:'🟠 明天',later:'📅 以后'};
  el.innerHTML=rows.map(n=>{
    const c=n.match_cases||{},p=c.parent_requests||{},t=c.tutor_profiles||{},b=followupBucket(n.next_action_at);
    return '<div class="case" style="cursor:pointer" onclick="showCase('+n.match_case_id+')">'+
      '<div class="case-head"><div><b>'+esc(p.contact_name||'-')+' ↔ '+esc(t.name||'-')+'</b><div class="meta">'+esc(p.subject||'-')+' · '+esc(p.level||'-')+' · 案例 #'+n.match_case_id+'</div></div>'+
      '<div class="actions" style="margin-top:0"><span class="badge '+(b==='today'?'warn':'')+'">'+groups[b]+'</span><span class="badge">'+esc(followStatusText(c.status))+'</span></div></div>'+
      '<div class="meta">上次记录：'+esc(String(n.note||'').replace(/\n/g,' '))+'</div>'+
      '<div style="margin-top:6px"><b>➡ 下一步：'+esc(n.next_action||'-')+'</b> · 到期：'+esc(fmtTime(n.next_action_at))+'</div>'+
      '<div class="actions"><button onclick="event.stopPropagation();completeFollowup('+n.id+')">✓ 已完成</button><button onclick="event.stopPropagation();showCase('+n.match_case_id+')">查看案例</button></div>'+
      '</div>';
  }).join('');
}
function showFollowups(bucket){
  const rows=bucket?followups.filter(x=>followupBucket(x.next_action_at)===bucket):followups;
  renderFollowups(rows);
  document.getElementById('followup-list')?.scrollIntoView({behavior:'smooth',block:'start'});
}
async function completeFollowup(id){
  const {error}=await sb.from('match_case_notes').update({completed_at:new Date().toISOString()}).eq('id',id);
  if(error){alert('操作失败：'+error.message);return}
  await loadFollowups();
}

function sgDayKey(v){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v))}
function sgDayDiff(v){const a=new Date(sgDayKey(new Date())+'T00:00:00+08:00'),b=new Date(sgDayKey(v)+'T00:00:00+08:00');return Math.round((b-a)/86400000)}
function warStatus(s){return {new:'新需求',matched:'已配对',contacting:'沟通中',trial:'试听中',pending_confirmation:'待确认',confirmed:'已成交',ongoing:'进行中',not_concluded:'未成交',cancelled:'已取消'}[s]||s}
function warRisk(c){if(['confirmed','cancelled','not_concluded'].includes(c.status))return false;const open=followups.some(n=>n.match_case_id===c.id);const stale=c.last_contacted_at?Math.floor((Date.now()-new Date(c.last_contacted_at).getTime())/86400000):99;return !open&&stale>=3}
function loadWarRoom(){renderWarRoom()}
function renderWarRoom(){
 const el=document.getElementById('warroom-list'),st=document.getElementById('warroom-stats');if(!el||!st)return;
 const overdue=followups.filter(x=>sgDayDiff(x.next_action_at)<0),today=followups.filter(x=>sgDayDiff(x.next_action_at)===0),next7=followups.filter(x=>sgDayDiff(x.next_action_at)>=0&&sgDayDiff(x.next_action_at)<=7),risk=cases.filter(warRisk);
 st.innerHTML='<div class="stat"><b>🔴 '+overdue.length+'</b><span>逾期待办</span></div><div class="stat"><b>🟠 '+today.length+'</b><span>今日必须处理</span></div><div class="stat"><b>⚠️ '+risk.length+'</b><span>高风险案例</span></div><div class="stat"><b>📅 '+next7.length+'</b><span>未来7天任务</span></div>';
 let rows=followups.map(x=>({kind:'task',n:x,c:x.match_cases||{}})).concat(risk.map(c=>({kind:'risk',n:{match_case_id:c.id,contact_target:'both',note:'超过3天没有下一步跟进记录',next_action:'立即联系并建立下一步'},c:c})));
 rows=rows.filter(x=>{if(warFilter==='overdue')return x.kind==='task'&&sgDayDiff(x.n.next_action_at)<0;if(warFilter==='today')return x.kind==='task'&&sgDayDiff(x.n.next_action_at)===0;if(warFilter==='7days')return x.kind==='task'&&sgDayDiff(x.n.next_action_at)>=0&&sgDayDiff(x.n.next_action_at)<=7;if(warFilter==='risk')return x.kind==='risk';return true});
 rows.sort((a,b)=>{const priority=x=>x.kind==='risk'?0:(sgDayDiff(x.n.next_action_at)<0?1:sgDayDiff(x.n.next_action_at)===0?2:3);return priority(a)-priority(b)||(new Date(a.n.next_action_at||'9999')-new Date(b.n.next_action_at||'9999'))});
 if(!rows.length){el.innerHTML='<div class="meta">🎉 今天没有需要处理的任务。</div>';return}
 el.innerHTML=rows.map(x=>{const c=x.c||{},p=c.parent_requests||{},t=c.tutor_profiles||{},d=x.kind==='risk'?'risk':sgDayDiff(x.n.next_action_at)<0?'overdue':sgDayDiff(x.n.next_action_at)===0?'today':'later';const badge=x.kind==='risk'?'⚠️ 高风险':d==='overdue'?'🔴 逾期':d==='today'?'🟠 今天':'📅 后续';return '<div class="case" style="margin:8px 0"><div class="case-head"><div><b>'+esc(p.contact_name||'-')+' ↔ '+esc(t.name||'-')+'</b><div class="meta">案例 #'+x.n.match_case_id+' · '+esc(p.subject||'-')+' · '+esc(p.level||'-')+' · '+esc(warStatus(c.status))+'</div></div><div class="actions" style="margin-top:0"><span class="badge '+(d==='today'?'warn':'')+'">'+badge+'</span><button onclick="showCase('+x.n.match_case_id+')">打开案例</button>'+(x.kind==='task'?'<button onclick="completeFollowup('+x.n.id+')">✓ 完成</button>':'')+'</div></div><div style="margin-top:8px"><span class="meta">上次结果：</span>'+esc(x.n.note||'-')+'</div><div style="margin-top:5px"><b>➡ 下一步：</b>'+esc(x.n.next_action||'立即建立下一步')+' <span class="meta">'+(x.n.next_action_at?'· '+fmtTime(x.n.next_action_at):'')+'</span></div></div>'}).join('')}
function renderStats(){
  const parents=directoryCache.parents||[],tutors=directoryCache.tutors||[];
  const today=new Date().toISOString().slice(0,10),month=new Date().toISOString().slice(0,7);
  const newParents=parents.filter(x=>String(x.created_at||'').slice(0,10)===today).length;
  const newTutors=tutors.filter(x=>String(x.created_at||'').slice(0,10)===today).length;
  const interested=cases.filter(x=>x.status==='matched').length;
  const contacting=cases.filter(x=>x.status==='contacting').length;
  const trial=cases.filter(x=>x.status==='trial').length;
  const confirmed=cases.filter(x=>x.status==='confirmed').length;
  const commission=cases.filter(x=>String(x.confirmed_at||'').slice(0,7)===month&&x.status==='confirmed').reduce((s,x)=>s+Number(x.commission_amount||0),0);
  document.getElementById('stats').innerHTML=
    '<div class="stat"><b>'+newParents+'</b><span>今日新家长</span></div>'+
    '<div class="stat"><b>'+newTutors+'</b><span>今日新老师</span></div>'+
    '<div class="stat"><b>'+interested+'</b><span>已配对</span></div>'+
    '<div class="stat"><b>'+contacting+'</b><span>沟通中</span></div>'+
    '<div class="stat"><b>'+trial+'</b><span>试听中</span></div>'+
    '<div class="stat"><b>'+confirmed+'</b><span>已成交</span></div>'+
    '<div class="stat"><b>S$'+commission.toFixed(2)+'</b><span>本月佣金</span></div>';
}
function filterCases(status){caseFilter=status;renderCases();}
function renderCases(){
  const el=document.getElementById('cases');
  const visible=caseFilter==='all'?cases:cases.filter(x=>x.status===caseFilter);
  if(!visible.length){el.innerHTML='<div class="meta">还没有撮合案例。平台运营人员建立 SmartMatch 案例后会在这里管理整个撮合流程。</div>';return}
  el.innerHTML=visible.map(c=>{
    const p=c.parent_requests||{},t=c.tutor_profiles||{};
    const statusText={new:'新需求',matched:'已配对',contacting:'平台沟通中',trial:'已安排试听',pending_confirmation:'待确认',confirmed:'已确认成交',ongoing:'进行中',not_concluded:'未成交',cancelled:'已取消'}[c.status]||c.status;
    const form='<div class="formgrid"><div><label>实际课费/小时</label><input id="rate-'+c.id+'" type="number" min="0" step="0.5" value="'+(c.hourly_rate??'')+'" placeholder="50"></div><div><label>单次课时</label><input id="duration-'+c.id+'" type="number" min="0.5" step="0.5" value="'+(c.lesson_duration_hours??'')+'" placeholder="2"></div><div><label>每周次数</label><input id="freq-'+c.id+'" type="number" min="0.5" step="0.5" value="'+(c.lessons_per_week??'')+'" placeholder="2"></div><div><label>首次上课日期</label><input id="date-'+c.id+'" type="date" value="'+(c.first_lesson_date||'')+'"></div></div>';
    const reasons=['家长取消','老师取消','预算不合适','时间不合适','地区不合适','双方沟通后不合适','已自行找到老师','其他'];
    const reasonSelect='<select id="reason-'+c.id+'"><option value="">选择未成交原因</option>'+reasons.map(x=>'<option '+(c.not_concluded_reason===x?'selected':'')+'>'+x+'</option>').join('')+'</select>';
    return '<div class="case"><div class="case-head"><div><b>'+esc(p.subject||'-')+' · '+esc(p.level||'-')+'</b><div class="meta">家长：'+esc(p.contact_name||'-')+' · '+esc(p.contact_phone||'-')+' · 微信 '+esc(p.contact_wechat||'-')+' · '+esc(p.contact_email||'-')+' · 老师：'+esc(t.name||'-')+' · '+esc(t.contact_phone||'-')+' · '+esc(t.contact_email||'-')+'</div></div><div class="actions" style="margin-top:0"><span class="badge '+(c.status==='confirmed'?'ok':c.status==='not_concluded'?'warn':'')+'">'+esc(statusText)+'</span><button onclick="showCase('+c.id+')">查看详情</button></div></div><div class="actions"><button onclick="openWhatsApp('parent',p.contact_whatsapp||p.contact_phone,c.id)">💬 WhatsApp 家长</button><button onclick="openWhatsApp('tutor',t.whatsapp||t.contact_phone,c.id)">💬 WhatsApp 老师</button></div><div class="meta">地区：'+esc(p.region||'-')+' · 家长预算：'+esc(p.budget||'-')+' · '+esc(p.freq||'-')+' · 每次'+esc(p.duration||'-')+' · '+esc(p.timeslot||'-')+'</div>'+form+'<div class="meta">预计平台佣金：S$'+(c.commission_amount?Number(c.commission_amount).toFixed(2):'—')+'</div><div class="actions"><button onclick="setStatus('+c.id+',\'contacting\')">平台沟通中</button><button onclick="setStatus('+c.id+',\'trial\')">安排试听</button><button onclick="setStatus('+c.id+',\'pending_confirmation\')">待确认</button><button class="primary" onclick="confirmDeal('+c.id+')">✓ 确认成交</button><button onclick="setStatus('+c.id+',\'ongoing\')">进入进行中</button>'+reasonSelect+'<button class="danger" onclick="notConcluded('+c.id+')">确认未成交</button></div></div>';
  }).join('');
}
async function setStatus(id,status){
  const patch={status};
  if(status==='contacting') patch.last_contacted_at=new Date().toISOString();
  const {error}=await sb.from('match_cases').update(patch).eq('id',id);
  if(error)alert(error.message);else loadCases();
}
async function confirmDeal(id){
  const c=cases.find(x=>x.id===id);if(!c)return;
  if(!['matched','contacting','trial','pending_confirmation'].includes(c.status)){alert('请先建立配对并完成沟通/试听，再确认成交。');return;}
  const rate=Number(document.getElementById('rate-'+id).value),duration=Number(document.getElementById('duration-'+id).value),freq=Number(document.getElementById('freq-'+id).value),date=document.getElementById('date-'+id).value||null;
  if(!(rate>0&&duration>0)){alert('请填写实际课费和单次课时');return}
  const commission=rate*duration*2;
  const {data:{user}}=await sb.auth.getUser();
  const {error}=await sb.from('match_cases').update({status:'confirmed',confirmed_at:new Date().toISOString(),confirmed_by:user.id,hourly_rate:rate,lesson_duration_hours:duration,lessons_per_week:freq||null,first_lesson_date:date,commission_amount:commission,commission_status:'pending'}).eq('id',id);
  if(error){alert(error.message);return}
  const {error:closeError}=await sb.from('parent_requests').update({request_status:'closed'}).eq('id',c.parent_request_id);
  if(closeError){alert('成交已记录，但家长需求关闭失败：'+closeError.message);return}
  await recalcScores(c.parent_request_id,c.tutor_id);
  await loadCases();
  await loadDirectory();
}
async function notConcluded(id){
  const reason=document.getElementById('reason-'+id).value;if(!reason){alert('请选择未成交原因');return}
  const c=cases.find(x=>x.id===id);
  const {error}=await sb.from('match_cases').update({status:'not_concluded',not_concluded_reason:reason}).eq('id',id);
  if(error){alert(error.message);return}
  await recalcScores(c.parent_request_id,c.tutor_id);await loadCases();await loadDirectory();
}
async function loadDirectory(){
  const [parents,tutors]=await Promise.all([
    sb.from('parent_requests').select('*').order('created_at',{ascending:false}),
    sb.from('tutor_profiles').select('*').order('created_at',{ascending:false})
  ]);
  if(parents.error){document.getElementById('parent-directory').innerHTML='<div class="meta">读取家长需求失败：'+esc(parents.error.message)+'</div>'}
  else {directoryCache.parents=parents.data||[];renderParentDirectory(directoryCache.parents);}
  if(tutors.error){document.getElementById('tutor-directory').innerHTML='<div class="meta">读取老师资料失败：'+esc(tutors.error.message)+'</div>'}
  else {directoryCache.tutors=tutors.data||[];renderTutorDirectory(directoryCache.tutors);}
  renderStats();
}
function renderParentDirectory(rows){
  const el=document.getElementById('parent-directory');
  if(!rows.length){el.innerHTML='<div class="meta">暂无家长需求。</div>';return}
  el.innerHTML=rows.map(p=>{
    const active=p.request_status==='active';
    return '<div class="case"><div class="case-head"><div><b>'+esc(p.subject||'-')+' · '+esc(p.level||'-')+'</b><div class="meta">'+esc(p.contact_name||'-')+' · '+esc(p.contact_phone||'-')+' · '+esc(p.contact_email||'-')+' · 微信 '+esc(p.contact_wechat||'-')+' · '+esc(p.region||'-')+'</div></div><span class="badge '+(active?'ok':'warn')+'">'+(active?'开放中':p.request_status==='closed'?'已关闭':'已移除')+'</span></div><div class="meta">预算：'+esc(p.budget||'-')+' · 创建：'+esc(p.created_at||'-')+'</div><div class="actions">'+(active?'<button class="danger" onclick="removeParent('+p.id+')">移除需求</button>':'<button onclick="restoreParent('+p.id+')">重新开放</button>')+'</div></div>';
  }).join('');
}
async function setTutorReview(id,status){
  const {error}=await sb.from('tutor_profiles').update({review_status:status,tutor_status:status==='verified'?'active':'pending'}).eq('id',id);
  if(error){alert('审核更新失败：'+error.message);return}
  await loadDirectory();
}
function renderTutorDirectory(rows){
  const el=document.getElementById('tutor-directory');
  if(!rows.length){el.innerHTML='<div class="meta">暂无老师资料。</div>';return}
  el.innerHTML=rows.map(t=>{
    const active=t.tutor_status==='active';
    return '<div class="case"><div class="case-head"><div><b>'+esc(t.name||'-')+'</b><div class="meta">'+esc(t.cred||'-')+' · '+esc(t.rate||'-')+' · '+esc(t.contact_phone||'-')+' · '+esc(t.contact_email||'-')+' · WhatsApp '+esc(t.whatsapp||'-')+'</div></div><span class="badge '+(active?'ok':'warn')+'">'+(active?'接单中':'已移除')+'</span></div><div class="meta">创建：'+esc(t.created_at||'-')+'</div><div class="actions">'+(active?'<button class="danger" onclick="removeTutor('+t.id+')">移除老师</button>':'<button onclick="restoreTutor('+t.id+')">重新启用</button>')+'</div></div>';
  }).join('');
}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function showModal(title,body){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal').classList.remove('hidden');}
function item(label,value){return '<div class="detail-item"><b>'+esc(label)+'</b><div>'+esc(value||'-')+'</div></div>';}
function showParent(id){
  const p=directoryCache.parents.find(x=>x.id===id);if(!p)return;
  const fields=[['状态',p.request_status==='active'?'开放中':p.request_status==='closed'?'已关闭':'已移除'],['孩子年级',p.level],['科目',p.subject],['语言',p.lang],['地区',p.region],['邮编',p.postcode],['地址',p.address],['预算',p.budget],['频率',p.freq],['每次课时',p.duration],['时间',p.timeslot],['学习目标',p.goal],['老师性别要求',p.gender],['授课方式',p.mode],['老师类型',p.tutortype],['家长称呼',p.contact_name],['电话',p.contact_phone],['WhatsApp',p.contact_whatsapp],['Email',p.contact_email],['微信',p.contact_wechat],['备注',p.notes],['创建时间',p.created_at]];
  showModal('家长需求 #'+id,'<div class="detail-grid">'+fields.map(x=>item(x[0],x[1])).join('')+'</div>');
}
function showTutor(id){
  const t=directoryCache.tutors.find(x=>x.id===id);if(!t)return;
  const fields=[['状态',t.tutor_status==='active'?'接单中':'已移除'],['审核',t.review_status||'pending'],['Tutor ID',t.public_id],['姓名',t.name],['教学范围',Array.isArray(t.scopes)?t.scopes.join('、'):t.scopes],['年级',t.level],['学历/资质',t.cred],['收费',t.rate],['性别',t.gender],['授课方式',t.mode],['语言',t.lang],['经验',t.exp],['试听',t.trial],['服务区域',Array.isArray(t.regions)?t.regions.join('、'):t.regions],['可用时间',Array.isArray(t.timeslots)?t.timeslots.join('、'):t.timeslots],['电话',t.contact_phone],['WhatsApp',t.whatsapp],['Email',t.contact_email],['履历',t.resume_name||t.resume_path],['个人介绍',t.bio],['创建时间',t.created_at]];
  showModal('老师资料 #'+id,'<div class="detail-grid">'+fields.map(x=>item(x[0],x[1])).join('')+'</div>');
}
async function showCase(id){
  const c=cases.find(x=>x.id===id);if(!c)return;
  const p=c.parent_requests||{},t=c.tutor_profiles||{};
  const statusText={new:'新需求',matched:'已配对',contacting:'平台沟通中',trial:'已安排试听',pending_confirmation:'待确认',confirmed:'已确认成交',ongoing:'进行中',not_concluded:'未成交',cancelled:'已取消'}[c.status]||c.status;
  const fields=[
    ['案例状态',statusText],['家长',p.contact_name],['家长电话',p.contact_phone],['家长微信',p.contact_wechat],['家长Email',p.contact_email],
    ['老师',t.name],['老师电话',t.contact_phone],['老师WhatsApp',t.whatsapp],['老师Email',t.contact_email],
    ['双方兴趣',c.parent_interested_at&&c.tutor_interested_at?'双方均已表达兴趣':'一方已表达兴趣'],
    ['家长兴趣时间',c.parent_interested_at],['老师兴趣时间',c.tutor_interested_at],['最近联系',c.last_contacted_at],
    ['试听/首课日期',c.first_lesson_date],['实际课费/小时',c.hourly_rate?'S$'+c.hourly_rate:''],
    ['单次课时',c.lesson_duration_hours?c.lesson_duration_hours+' 小时':''],['每周次数',c.lessons_per_week],
    ['平台佣金',c.commission_amount?'S$'+Number(c.commission_amount).toFixed(2):''],
    ['佣金状态',c.commission_status],['未成交原因',c.not_concluded_reason],['平台备注',c.platform_note],['创建时间',c.created_at]
  ];
  showModal('撮合案例 #'+id,'<div class="detail-grid">'+fields.map(x=>item(x[0],x[1])).join('')+'</div>'+
    '<div style="margin-top:18px;border-top:1px solid var(--line);padding-top:16px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="margin:0">撮合时间线</h3><button onclick="loadCaseTimeline('+id+')">刷新</button></div>'+
      '<div class="note">每次联系家长/老师后，记录“联系对象、结果、下一步”，以后打开这个案例就能完整回顾。</div>'+
      '<div class="formgrid" style="grid-template-columns:1fr 1fr;margin-top:12px">'+
        '<div><label>联系对象</label><select id="timeline-who"><option value="parent">家长</option><option value="tutor">老师</option><option value="both">双方</option></select></div>'+
        '<div><label>记录类型</label><select id="timeline-type"><option value="call">电话</option><option value="whatsapp">WhatsApp</option><option value="email">Email</option><option value="note">平台备注</option><option value="trial">试听</option><option value="follow_up">Follow-up</option></select></div>'+
      '</div>'+
      '<label style="display:block;margin-top:10px">沟通结果 / 平台备注</label><textarea id="timeline-note" rows="3" placeholder="例如：今天联系家长，家长确认周二晚上可以试听；老师已确认时间。"></textarea>'+
      '<div class="formgrid" style="grid-template-columns:1fr 1fr">'+
        '<div><label>下一步做什么</label><input id="timeline-next" placeholder="例如：明天确认试听结果"></div>'+
        '<div><label>下一步时间</label><input id="timeline-next-at" type="datetime-local"></div>'+
      '</div>'+
      '<div class="actions"><button class="primary" onclick="saveCaseTimeline('+id+')">保存这次记录</button></div>'+
      '<div id="case-timeline" style="margin-top:14px"></div>'+
    '</div>');
  await loadCaseTimeline(id);
}
function timelineTypeText(t){return {note:'平台备注',call:'电话',whatsapp:'WhatsApp',email:'Email',trial:'试听',follow_up:'Follow-up',status:'状态'}[t]||t}
function timelineWhoText(t){return {parent:'家长',tutor:'老师',both:'双方'}[t]||t}
function fmtTime(v){if(!v)return '-';const d=new Date(v);return isNaN(d)?v:d.toLocaleString('zh-SG',{hour12:false})}
async function loadCaseTimeline(id){
  const el=document.getElementById('case-timeline');if(!el)return;
  el.innerHTML='<div class="meta">正在读取时间线...</div>';
  const {data,error}=await sb.from('match_case_notes').select('*,platform_admins(display_name)').eq('match_case_id',id).order('created_at',{ascending:false});
  if(error){el.innerHTML='<div class="meta">时间线读取失败：'+esc(error.message)+'</div>';return}
  const rows=data||[];
  if(!rows.length){el.innerHTML='<div class="meta">还没有记录。第一次联系家长或老师后，就在这里留下记录。</div>';return}
  el.innerHTML=rows.map(n=>'<div style="border-left:3px solid var(--line);padding:10px 0 10px 14px;margin:10px 0">'+
    '<div><b>'+esc(timelineWhoText(n.contact_target))+'</b> <span class="badge">'+esc(timelineTypeText(n.note_type))+'</span> <span class="meta">'+esc(fmtTime(n.created_at))+'</span></div>'+
    '<div style="margin-top:5px;white-space:pre-wrap">'+esc(n.note)+'</div>'+
    (n.next_action?'<div class="meta" style="margin-top:5px">➡ 下一步：'+esc(n.next_action)+(n.next_action_at?' · '+esc(fmtTime(n.next_action_at)):'')+'</div>':'')+
    (n.platform_admins?.display_name?'<div class="meta">记录人：'+esc(n.platform_admins.display_name)+'</div>':'')+
    '</div>').join('');
}
async function saveCaseTimeline(id){
  const note=document.getElementById('timeline-note')?.value.trim();
  if(!note){alert('请填写沟通结果或平台备注');return}
  const who=document.getElementById('timeline-who')?.value||'both';
  const type=document.getElementById('timeline-type')?.value||'note';
  const next=document.getElementById('timeline-next')?.value.trim()||null;
  const nextAtValue=document.getElementById('timeline-next-at')?.value;
  const nextAt=nextAtValue?new Date(nextAtValue).toISOString():null;
  const {data:{user}}=await sb.auth.getUser();
  if(!user){alert('登录已失效，请重新登录');return}
  const fullNote='联系对象：'+timelineWhoText(who)+'\n'+note;
  const {error}=await sb.from('match_case_notes').insert({match_case_id:id,admin_user_id:user.id,contact_target:who,note_type:type,note:note,next_action:next,next_action_at:nextAt});
  if(error){alert('保存失败：'+error.message);return}
  await sb.from('match_cases').update({last_contacted_at:new Date().toISOString()}).eq('id',id);
  document.getElementById('timeline-note').value='';document.getElementById('timeline-next').value='';document.getElementById('timeline-next-at').value='';
  await loadCaseTimeline(id);await loadCases();
}
async function removeParent(id){
  const reason=prompt('移除家长需求的原因（可选）：')||'平台移除';
  const {error}=await sb.from('parent_requests').update({request_status:'removed',removed_at:new Date().toISOString(),removed_reason:reason}).eq('id',id);
  if(error)alert(error.message);else await loadDirectory();
}
async function restoreParent(id){
  const {error}=await sb.from('parent_requests').update({request_status:'active',removed_at:null,removed_reason:null}).eq('id',id);
  if(error)alert(error.message);else await loadDirectory();
}
async function removeTutor(id){
  const reason=prompt('移除老师的原因（例如暂不接单）：')||'平台移除';
  const {error}=await sb.from('tutor_profiles').update({tutor_status:'removed',removed_at:new Date().toISOString(),removed_reason:reason}).eq('id',id);
  if(error)alert(error.message);else await loadDirectory();
}
async function restoreTutor(id){
  const {error}=await sb.from('tutor_profiles').update({tutor_status:'active',removed_at:null,removed_reason:null}).eq('id',id);
  if(error)alert(error.message);else await loadDirectory();
}
async function recalcScores(parentId,tutorId){
  const [{data:all},{data:ints}] = await Promise.all([
    sb.from('match_cases').select('parent_request_id,tutor_id,status'),
    sb.from('match_interests').select('parent_request_id,tutor_id,interested_by')
  ]);
  const rows=all||[], interests=ints||[];
  const ts=rows.filter(x=>x.tutor_id===tutorId),ps=rows.filter(x=>x.parent_request_id===parentId);
  const tInterests=interests.filter(x=>x.tutor_id===tutorId && x.interested_by==='parent').length;
  const pInterests=interests.filter(x=>x.parent_request_id===parentId && x.interested_by==='tutor').length;
  const tConfirmed=ts.filter(x=>x.status==='confirmed').length,tNo=ts.filter(x=>x.status==='not_concluded').length,tCancel=ts.filter(x=>x.status==='cancelled').length;
  const pConfirmed=ps.filter(x=>x.status==='confirmed').length,pNo=ps.filter(x=>x.status==='not_concluded').length,pCancel=ps.filter(x=>x.status==='cancelled').length;
  const tScore=Math.max(0,tConfirmed*12-tNo*2-tCancel*5),pScore=Math.max(0,pConfirmed*15-pNo*2-pCancel*5);
  const tLevel=tScore>=100?'金牌':tScore>=60?'银牌':tScore>=25?'铜牌':tScore<5&&tNo>=5?'观察':'普通';
  const pLevel=pScore>=80?'黄质':pScore>=45?'银质':pScore>=20?'铜质':pScore<5&&pNo>=5?'观察':'普通';
  await sb.from('tutor_internal_scores').upsert({tutor_id:tutorId,level:tLevel,recommendations:ts.length,interests:tInterests,confirmed_deals:tConfirmed,not_concluded:tNo,cancellations:tCancel,score:tScore,updated_at:new Date().toISOString()});
  await sb.from('parent_internal_scores').upsert({parent_request_id:parentId,level:pLevel,requests:ps.length,interests:pInterests,confirmed_deals:pConfirmed,not_concluded:pNo,cancellations:pCancel,score:pScore,updated_at:new Date().toISOString()});
}
boot();
</script>
