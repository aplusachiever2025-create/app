<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19376d"><title>新加坡试卷索引｜Singapore Exam Papers</title>
<style>
:root{--ink:#17243b;--muted:#65748b;--line:#e2e8f0;--bg:#f4f7fb;--blue:#2457d6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Noto Sans SC",sans-serif}.hero{background:linear-gradient(125deg,#172c53,#2b63d9);color:white;padding:35px 20px 52px}.inner{max-width:1160px;margin:auto}.hero h1{font-size:clamp(25px,4vw,36px);margin:0 0 7px}.hero p{margin:0;opacity:.9}.wrap{max-width:1160px;margin:-23px auto 36px;padding:0 16px}.search{background:white;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:9px;box-shadow:0 8px 28px #10234a12}.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:12px;font:inherit}.btn{border:0;border-radius:9px;background:var(--blue);color:white;padding:10px 15px;font-weight:650;cursor:pointer}.layout{display:grid;grid-template-columns:235px 1fr;gap:17px;margin-top:17px}.filters,.paper{background:white;border:1px solid var(--line);border-radius:12px}.filters{padding:15px;align-self:start;position:sticky;top:12px}.filters h2{font-size:15px;margin:0 0 10px}.field{margin:11px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:white}.reset{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:white;cursor:pointer}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.pill{background:#eaf1ff;color:#214ca9;padding:5px 10px;border-radius:30px;font-size:13px}.paper{padding:14px 16px;margin:8px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.ptitle{font-weight:700;margin-bottom:6px;overflow-wrap:anywhere}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{background:#f0f3f8;color:#526178;padding:2px 7px;border-radius:5px;font-size:12px}.source{font-size:12px;color:var(--muted);margin-top:6px}.actions{display:flex;gap:7px;flex-shrink:0}.actions a{font-size:13px;text-decoration:none;padding:7px 10px;border:1px solid var(--line);border-radius:7px}.actions .open{background:var(--blue);border-color:var(--blue);color:white}.empty,.notice{background:white;border:1px solid var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted)}.notice{display:none;text-align:left;margin-top:12px;background:#fff8dc;border-color:#f2df8b;color:#725b00}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:17px}.pager button{padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:white;cursor:pointer}.pager button:disabled{opacity:.4}.foot{max-width:1160px;margin:auto;padding:0 16px 32px;color:var(--muted);font-size:12px}.foot a{color:var(--blue)}@media(max-width:740px){.layout{grid-template-columns:1fr}.filters{position:static}.paper{align-items:stretch;flex-direction:column}.actions a{flex:1;text-align:center}.search{flex-direction:column}}
</style></head><body>
<header class="hero"><div class="inner"><h1>新加坡试卷索引</h1><p>Singapore Exam Papers · 搜索公开试卷链接，按年级、科目、年份、学校和考试类型筛选</p></div></header>
<div class="wrap"><div class="search"><input id="q" type="search" placeholder="例如：Nanyang P6 Science 2025 / Sec 4 Physics Prelim"><button class="btn" id="clearTop">清除</button></div><div class="notice" id="notice"></div>
<div class="layout"><aside class="filters"><h2>筛选条件</h2><div id="filters"></div><button class="reset" id="reset">重置所有筛选</button></aside><main><div class="stats" id="stats"></div><div id="list"></div><div class="pager" id="pager"></div></main></div></div>
<footer class="foot">本站仅整理原网站公开页面或文件链接，不托管、不重新分发 PDF。请遵守各来源网站的 robots.txt、版权和使用条款。来源：<a href="https://sgexam.com/" target="_blank" rel="noopener">SGExam</a> · <a href="https://www.sgtestpaper.com/" target="_blank" rel="noopener">SGTestPaper</a> · <a href="https://www.testpapersfree.com/" target="_blank" rel="noopener">TestPapersFree</a> · <a href="https://www.sgexams.com/" target="_blank" rel="noopener">SGExams</a></footer>
<script>
const FIELDS=[['level','年级'],['subject','科目'],['year','年份'],['school','学校'],['exam','考试类型'],['source_site','来源']],SIZE=35;
let DATA=[],page=1;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sourceName=s=>({sgtestpaper:'SGTestPaper',sgexam:'SGExam',sgexams:'SGExams',testpapersfree:'TestPapersFree'}[s]||s||'Unknown');
function buildFilters(){ $('filters').innerHTML=FIELDS.map(([k,n])=>{let vs=[...new Set(DATA.map(d=>d[k]))].filter(v=>v!==undefined&&v!==null&&v!==''&&v!=='Unknown'&&v!==0);vs.sort((a,b)=>k==='year'?b-a:String(a).localeCompare(String(b),undefined,{numeric:true}));return '<div class="field"><label>'+n+'</label><select id="f_'+k+'"><option value="">全部</option>'+vs.map(v=>'<option value="'+esc(v)+'">'+esc(k==='source_site'?sourceName(v):v)+'</option>').join('')+'</select></div>'}).join('');FIELDS.forEach(([k])=>$('f_'+k).onchange=()=>{page=1;render()})}
function filtered(){let q=$('q').value.trim().toLowerCase(),sel=Object.fromEntries(FIELDS.map(([k])=>[k,$('f_'+k).value]));return DATA.filter(d=>FIELDS.every(([k])=>!sel[k]||String(d[k])===sel[k])&&(!q||Object.values(d).join(' ').toLowerCase().includes(q)))}
function render(){let rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/SIZE));page=Math.min(page,pages);let slice=rows.slice((page-1)*SIZE,page*SIZE);$('stats').innerHTML='<span class="pill">匹配 '+rows.length.toLocaleString()+' 份</span><span class="pill">第 '+page+'/'+pages+' 页</span><span class="pill">'+new Set(rows.map(x=>x.source_site)).size+' 个来源</span>';
$('list').innerHTML=slice.length?slice.map(d=>'<article class="paper"><div><div class="ptitle">'+esc(d.title)+'</div><div class="tags">'+[d.level,d.subject,d.year,d.school,d.exam].filter(x=>x&&x!=='Unknown'&&x!==0).map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+'</div><div class="source">来源：'+esc(sourceName(d.source_site))+'</div></div><div class="actions"><a class="open" href="'+esc(d.pdf_url)+'" target="_blank" rel="noopener noreferrer">打开试卷</a><a href="'+esc(d.source_page||d.pdf_url)+'" target="_blank" rel="noopener noreferrer">来源页</a></div></article>').join(''):'<div class="empty">没有匹配的记录。试试减少筛选条件或更换关键词。</div>';
$('pager').innerHTML='<button '+(page<=1?'disabled':'')+' id="prev">上一页</button><span>'+page+' / '+pages+'</span><button '+(page>=pages?'disabled':'')+' id="next">下一页</button>';if($('prev'))$('prev').onclick=()=>{page--;render()};if($('next'))$('next').onclick=()=>{page++;render()}}
function reset(){ $('q').value='';FIELDS.forEach(([k])=>{let e=$('f_'+k);if(e)e.value=''});page=1;render()}
$('q').oninput=()=>{page=1;render()};$('reset').onclick=reset;$('clearTop').onclick=reset;
fetch('./papers.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('papers.json unavailable');return r.json()}).then(d=>{DATA=Array.isArray(d)?d:[];buildFilters();render()}).catch(()=>{$('notice').style.display='block';$('notice').textContent='索引数据暂时无法载入。请稍后刷新；管理员可通过仓库中的定时爬虫工作流更新数据。';buildFilters();render()});
</script></body></html>
