name: Refresh public exam paper index
on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 0"
permissions:
  contents: write
concurrency:
  group: refresh-exam-index
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - name: Crawl allowed public links (metadata only)
        run: python scripts/paper_crawler.py
      - name: Sync index metadata to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_papers_to_supabase.py
      - name: Commit static fallback index if changed
        run: |
          if ! git diff --quiet -- exam-papers/papers.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add exam-papers/papers.json
            git commit -m "Refresh exam paper index"
            git push
          else
            echo "Index unchanged"
          fi
