<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>我的课程表</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f4;font-family:Arial,"Microsoft YaHei",sans-serif;color:#111}.top{background:#17324d;color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.top h1{margin:0;font-size:23px}.top span{font-size:13px;opacity:.8}.bar{background:#fff;padding:10px 14px;border-bottom:1px solid #cbd5df;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:10}button{border:1px solid #cbd5df;background:#fff;border-radius:6px;padding:7px 11px;cursor:pointer}button:hover{background:#f1f5f9}.blue{background:#2563eb;color:#fff;border-color:#2563eb}.status{margin-left:auto;color:#64748b;font-size:12px}.sheet{padding:10px;overflow:auto}table{border-collapse:collapse;table-layout:fixed;min-width:1700px;width:100%;background:#fff}th,td{border:1px solid #aeb7bf}th{height:32px;background:#e8ecef;text-align:center;font-size:13px}th.day{background:#dce7ee;font-weight:700;font-size:14px}th.course{font-weight:700}th.time{font-weight:700;width:76px}th.num{width:34px}td.num{width:34px;text-align:center;background:#f7f8f9;font-weight:bold;font-size:12px}td.course{width:145px;height:64px;vertical-align:top;padding:5px;font-size:12px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}td.time{width:78px;height:64px;vertical-align:top;padding:5px;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}td[contenteditable="true"]:focus{outline:2px solid #2563eb;outline-offset:-2px;background:#fff!important}.empty{background:#f4f5f6}.green{background:#86c043}.yellow{background:#e6ed00}.cyan{background:#08a7cf}.white{background:#fff}.colorbar{display:flex;gap:4px;align-items:center}.color{width:24px;height:24px;border:1px solid #aaa;border-radius:4px;cursor:pointer}.color.green{background:#86c043}.color.yellow{background:#e6ed00}.color.cyan{background:#08a7cf}.color.white{background:#fff}.hint{padding:6px 14px;color:#64748b;font-size:12px}@media print{.top,.bar,.hint{display:none}.sheet{padding:0}table{min-width:0;width:100%}}</style></head><body><div id="pageLock" style="position:fixed;inset:0;background:#17324d;z-index:99999;display:flex;align-items:center;justify-content:center;"><div style="background:white;width:min(360px,90vw);padding:28px;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center;"><div style="font-size:38px;margin-bottom:8px">🔒</div><h2 style="margin:0 0 8px;color:#17324d">课程表</h2><p style="margin:0 0 18px;color:#64748b;font-size:13px">请输入访问密码</p><input id="pagePassword" type="password" inputmode="numeric" maxlength="3" placeholder="密码" style="width:100%;padding:11px;border:1px solid #cbd5df;border-radius:7px;text-align:center;font-size:20px;letter-spacing:8px"><button onclick="enterPage()" style="width:100%;margin-top:12px;padding:11px;border:0;border-radius:7px;background:#2563eb;color:white;font-weight:700;cursor:pointer">进入课程表</button><div id="pageError" style="height:18px;margin-top:8px;color:#dc2626;font-size:12px"></div></div></div><div class="top"><div><h1>📚 我的课程表</h1><span>独立网页 · 可直接修改 · 自动保存</span></div><span id="saved">🔒 已锁定 · 已保存</span></div><div class="bar"><button class="blue" onclick="unlock()">🔒 编辑</button><button id="saveBtn" onclick="save()" disabled>💾 保存修改</button><button onclick="installApp()">📲 添加到主屏幕</button><button onclick="window.print()">🖨 打印</button><button onclick="downloadData()">⬇ 导出</button><button onclick="document.getElementById('file').click()">⬆ 导入</button><button onclick="resetAll()">恢复原始课程表</button><span>颜色：</span><div class="colorbar"><div class="color green" onclick="paint('green')"></div><div class="color yellow" onclick="paint('yellow')"></div><div class="color cyan" onclick="paint('cyan')"></div><div class="color white" onclick="paint('white')"></div></div><input id="file" type="file" accept=".json" hidden onchange="importData(event)"></div><div class="hint">网页访问密码和编辑密码均为 689。课程数据现在保存到 Supabase 数据库；在另一台手机或电脑打开同一个网页，输入 689 即可读取最新课程表。修改后必须点击「保存修改」才会正式更新。未保存的修改不会覆盖已经保存的版本。</div><div class="sheet"><table id="t"><thead><tr><th class="num" rowspan="2">#</th><th class="day" colspan="2">Monday</th><th class="day" colspan="2">Tuesday</th><th class="day" colspan="2">Wednesday</th><th class="day" colspan="2">Thursday</th><th class="day" colspan="2">Friday</th><th class="day" colspan="2">Saturday</th><th class="day" colspan="2">ANNAINSG</th><th class="day" colspan="2">ANNA</th><th class="day" colspan="2">Sunday</th></tr><tr><th class="course">课程</th><th class="time">时间</th><th class="course">课程</th><th class="time">时间</th><th class="course">课程</th><th class="time">时间</th><th class="course">课程</th><th class="time">时间</th><th class="course">课程</th><th class="time">时间</th><th class="course">课程</th><th class="time">时间</th><th class="course">课程</th><th class="time">时间</th><th class="course">课程</th><th class="time">时间</th><th class="course">课程</th><th class="time">时间</th></tr></thead><tbody></tbody></table></div><script>
const SUPABASE_URL="https://mgywpctnaaroiwpzgxgq.supabase.co";
const SUPABASE_KEY="sb_publishable_to_CylU3a3D1JCLgRv-P8w_SKM7sm42";
const DB_PASSWORD="689";
const initial=[["S4 ENGLISH ANNA","7:30-9:30pm","JC2 GP Anna Ms. Lee","8:00-10:00pm","S2 ENGLISH ELSA","8:00-9:30PM","P5 ENGLISH ORAL APLUS","7:45-8:45pm","S4 SS ANNA","8-9:30PM","S2 HISTORY ELSA","9am-10:30AM","P6 Eng Compos Euge","9:00am-10:30am","JC2 GP ANNA","上午8:15-10:15","RI CHMISTRY APLUS 9月13日最后一节课","10:30-12:30pm"],["S2 科学 ELSA","8-9pm","","","JC1 GP Anna","8-10:00PM","JC2 GP Charis ANNA","8:00-10:00pm","中一地理 (Anna)","5:30-7pm","JC1 ECONOM APLUS ACHI","1:30-3:30PM","S4 CHIMISTRY","1-3PM","中二地理 ANNA","11:30-12:30","S3 CHEMISTY ELSA","1:30-3PM"],["中一历史 APLUS","8:00-9:30pm","","","S3 ENG APLUS","8:00-9:45pm","P6 SCIENCE ELSA","6-7:30PM","中四地理 ELSA 2 LESSONS","5:30-7:30PM","","","S1 MATHS","7:30-8:30PM","奥物 ANNA","1-3PM","S2 MATHS ELSA","8:30-9:30PM"],["","","","","","","","","","","","S1 SCIENCE","8:45-9:45PM","JC2 ECO APLUS","2:00-4:00PM","中三化学实验 20/27 SEP ELSA","10-12am"],["","","","","","","","","","","","奥生 ANNA","4:30-6:30PM","中三英文 Aplus","7:00–9:00 补课"],["","","","","","","","","","","JC1 GP ANNA","8:30-10:30PM","",""]];
let stored=JSON.parse(localStorage.getItem("myCourseSchedule")||"null");let rows=Array.isArray(stored)?stored:(stored&&stored.rows)||initial;let colors=(stored&&stored.colors)||rows.map(r=>r.map(x=>x?guessColor(x):"empty"));let selected=null,editing=false,dirty=false;
function render(){const tb=document.querySelector("#t tbody");tb.innerHTML="";rows.forEach((r,i)=>{const tr=document.createElement("tr"),n=document.createElement("td");n.className="num";n.textContent=i+1;tr.appendChild(n);for(let c=0;c<18;c++){const td=document.createElement("td");td.contentEditable=editing?"true":"false";td.className=(c%2===0?"course ":"time ")+(colors[i]&&colors[i][c]?colors[i][c]:(r[c]?guessColor(r[c]):"empty"));td.textContent=r[c]||"";td.onclick=()=>{if(editing)selected=td};td.oninput=()=>{rows[i][c]=td.innerText.trim();if(!colors[i])colors[i]=Array(18).fill("empty");if(!colors[i][c]||colors[i][c]==="empty")colors[i][c]=guessColor(rows[i][c])||"white";dirty=true;updateStatus()};tr.appendChild(td)}tb.appendChild(tr)})}
function guessColor(x){if(/RI CHMISTRY|中三化学实验/.test(x))return"green";if(/P5 ENGLISH|JC2 GP Charis/.test(x))return"cyan";if(/中三英文|补课/.test(x))return"yellow";return"white"}
function updateStatus(){const s=document.getElementById("saved"),b=document.getElementById("saveBtn");if(editing){s.textContent=dirty?"✏️ 已修改 · 请点击保存":"🔓 编辑模式";b.disabled=!dirty}else{s.textContent="🔒 已锁定 · 已保存";b.disabled=true}}
function unlock(){if(editing){lock();return}const pw=prompt("请输入编辑密码：");if(pw===DB_PASSWORD){editing=true;dirty=false;render();updateStatus()}else if(pw!==null)alert("密码错误")}
function lock(){if(dirty&&!confirm("还有未保存的修改，确定不保存并退出编辑吗？"))return;editing=false;dirty=false;stored=JSON.parse(localStorage.getItem("myCourseSchedule")||"null");rows=Array.isArray(stored)?stored:(stored&&stored.rows)||initial;colors=(stored&&stored.colors)||rows.map(r=>r.map(x=>x?guessColor(x):"empty"));render();updateStatus()}
async function save(){if(!editing||!dirty)return;const b=document.getElementById("saveBtn");b.disabled=true;document.getElementById("saved").textContent="⏳ 正在保存到数据库…";try{const res=await fetch(SUPABASE_URL+"/rest/v1/rpc/save_course_schedule",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_password:DB_PASSWORD,p_schedule:{rows:rows,colors:colors},p_title:"我的课程表"})});const data=await res.json();if(!res.ok||data.error||data.code)throw new Error(data.message||data.error||"保存失败");if(data&&data.schedule){rows=Array.isArray(data.schedule)?data.schedule:(data.schedule.rows||rows);colors=Array.isArray(data.schedule)?rows.map(r=>r.map(x=>x?guessColor(x):"empty")):(data.schedule.colors||colors)}localStorage.setItem("myCourseSchedule",JSON.stringify({rows:rows,colors:colors}));dirty=false;render();updateStatus()}catch(err){document.getElementById("saved").textContent="❌ 保存失败，请检查网络";b.disabled=false;alert("保存到数据库失败，请检查网络连接后再试。")}}
function addRow(){if(!editing){unlock();if(!editing)return}rows.push(Array(18).fill(""));colors.push(Array(18).fill("empty"));dirty=true;render();updateStatus();const last=document.querySelector("#t tbody tr:last-child td[contenteditable]");if(last)last.focus()}
function paint(c){if(!editing||!selected)return;const cells=[...document.querySelectorAll("#t tbody td[contenteditable]")];const idx=cells.indexOf(selected);if(idx<0)return;const row=Math.floor(idx/18),col=idx%18;if(!colors[row])colors[row]=Array(18).fill("empty");colors[row][col]=c;selected.classList.remove("green","yellow","cyan","white","empty");selected.classList.add(c);dirty=true;updateStatus()}
function downloadData(){const blob=new Blob([JSON.stringify(rows,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="我的课程表.json";a.click()}
function importData(e){if(!editing){e.target.value="";unlock();if(!editing)return}const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const imported=JSON.parse(rd.result);rows=Array.isArray(imported)?imported:(imported.rows||[]);colors=Array.isArray(imported)?rows.map(r=>r.map(x=>x?guessColor(x):"empty")):(imported.colors||rows.map(r=>r.map(x=>x?guessColor(x):"empty")));dirty=true;render();updateStatus();alert("文件已载入，请点击“保存修改”后才会正式更新课程表。")}catch(x){alert("文件格式不正确")}};rd.readAsText(f)}
function resetAll(){if(!editing){unlock();if(!editing)return}if(confirm("确定恢复原始课程表？恢复后仍需点击“保存修改”才会正式更新。")){rows=JSON.parse(JSON.stringify(initial));colors=rows.map(r=>r.map(x=>x?guessColor(x):"empty"));dirty=true;render();updateStatus()}}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&editing)lock();if(e.key==="Enter"&&document.activeElement===document.getElementById("pagePassword"))enterPage()});
async function enterPage(){const v=document.getElementById("pagePassword").value;if(v!==DB_PASSWORD){document.getElementById("pageError").textContent="密码错误，请重新输入";document.getElementById("pagePassword").select();return}document.getElementById("pageError").textContent="正在读取课程表…";try{const res=await fetch(SUPABASE_URL+"/rest/v1/rpc/get_course_schedule",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_password:v})});const data=await res.json();if(!res.ok||data.error||data.code)throw new Error(data.message||data.error||"读取失败");if(data&&data.schedule){rows=Array.isArray(data.schedule)?data.schedule:(data.schedule.rows||rows);colors=Array.isArray(data.schedule)?rows.map(r=>r.map(x=>x?guessColor(x):"empty")):(data.schedule.colors||colors);localStorage.setItem("myCourseSchedule",JSON.stringify({rows:rows,colors:colors}));render();updateStatus()}document.getElementById("pageLock").style.display="none";document.getElementById("pagePassword").value=""}catch(err){document.getElementById("pageError").textContent="无法连接数据库，请检查网络后重试";console.error(err)}}render();updateStatus();let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;});
async function installApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null;
    return;
  }
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS){
    alert("iPhone/iPad：请点 Safari 底部「分享」→「添加到主屏幕」。");
  }else{
    alert("如果浏览器没有弹出安装窗口，请打开浏览器菜单，选择「添加到主屏幕」或「安装应用」。");
  }
}
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script></body></html>
